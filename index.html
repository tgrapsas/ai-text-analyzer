<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Analyzer Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>🤖 AI Text Analyzer</h2>
        <p>Ανάλυση συναισθήματος και σύνοψη με τη δύναμη του AI.</p>

        <div class="rating-section">
            <label>Η βαθμολογία σου:</label>
            <div id="starRatingContainer">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
        </div>

        <textarea id="userInput" placeholder="Γράψτε το σχόλιό σας εδώ..."></textarea>

        <button id="analyzeBtn">Ανάλυση Κειμένου</button>

        <div id="resultBox" style="display: none;">
            <h3>Αποτέλεσμα Ανάλυσης</h3>
            <p><strong>Συναίσθημα:</strong> <span id="sentimentResult">-</span></p>
            <p><strong>Σύνοψη:</strong> <span id="summaryResult">-</span></p>
        </div>

        <div class="history-section">
            <h3>📜 Πρόσφατες Αξιολογήσεις</h3>
            <div id="evaluationsList"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
